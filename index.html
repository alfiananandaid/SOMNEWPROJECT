<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>STOCK OPNAME MANDIRI</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- Chart Library -->
</head>
<body>
  <div id="offline-banner">Memori Offline Aktif: <span id="offline-count">0</span> data menunggu sinkronisasi</div>
  <div id="toast-container"></div>

  <div id="app-root">
    <!-- View Login sama seperti sebelumnya... -->
    
    <div id="view-app" style="display:none; width:100%; height:100%; display:flex;">
      <!-- Main Content -->
      <main class="main-content">
        <div class="page-container">
          
          <!-- DASHBOARD -->
          <section id="page-dashboard" class="app-page">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
              <h2>Dashboard</h2>
            </div>
            <!-- Chart Container -->
            <div class="glass-card" style="margin-bottom: 20px; max-width: 100%; height: 250px;">
               <canvas id="dashboardChart"></canvas>
            </div>
            <div class="stats-grid">
              <!-- Kartu statistik tetap sama seperti sebelumnya... -->
            </div>
            <!-- Table Lokasi -->
            <div class="glass-card" style="margin-top:20px;">
              <h3 style="margin-bottom: 16px;">Aktifitas Lokasi</h3>
              <div class="table-responsive">
                <table class="data-table">
                  <thead><tr><th>Lokasi</th><th>Target</th><th>Dihitung</th><th>Sisa</th></tr></thead>
                  <tbody id="tbl-location-summary"></tbody>
                </table>
              </div>
            </div>
          </section>

          <!-- STOCK OPNAME (Dilengkapi Tombol Back & History) -->
          <section id="page-stock-opname" class="app-page" style="display:none;">
            <div class="sub-header">
              <button class="btn-back" onclick="App.navigate('dashboard')"><i data-lucide="chevron-left"></i> Dashboard</button>
              <h2 style="margin-left: auto;">Stock Opname</h2>
            </div>

            <div class="glass-card" style="max-width: 600px; margin: 0 auto;">
              <form id="form-stock-opname">
                <div class="form-group">
                  <label class="form-label">Cari / Pilih Lokasi *</label>
                  <input list="location-list" id="so-lokasi" class="form-control" placeholder="Ketik atau pilih lokasi..." required>
                  <datalist id="location-list">
                    <option value="Gudang Utama A">
                    <option value="Gudang Cadangan B">
                    <option value="Area Display / Toko">
                  </datalist>
                </div>

                <div class="form-group">
                  <label class="form-label">Scan Barcode / KLS / SKU *</label>
                  <div style="display:flex; gap:8px;">
                    <input type="text" id="so-barcode" class="form-control" placeholder="Scan atau ketik lalu Enter" required>
                    <button type="button" id="btn-open-scanner" class="btn btn-secondary"><i data-lucide="scan"></i></button>
                  </div>
                </div>

                <div id="so-product-info" class="glass-card" style="background: var(--bg-primary); display:none; margin: 16px 0;">
                  <h4 id="info-deskripsi" style="color: var(--accent-blue); margin-bottom: 8px;">-</h4>
                  <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.85rem;">
                    <div><strong>SKU:</strong> <span id="info-sku">-</span></div>
                    <div><strong>KLS:</strong> <span id="info-kls">-</span></div>
                    <div><strong>Dept:</strong> <span id="info-dept">-</span></div>
                    <div id="wrapper-qty-system" style="color:var(--accent-red); font-weight:600;">System: <span id="info-qty-system">0</span></div>
                  </div>
                </div>

                <div class="form-group">
                  <label class="form-label">Qty Fisik *</label>
                  <input type="number" id="so-qty" class="form-control" min="0" placeholder="0" required disabled>
                </div>

                <button type="submit" id="btn-save-so" class="btn btn-primary btn-block" disabled>SIMPAN DATA</button>
              </form>

              <!-- Akses History di Dalam Menu SO -->
              <div style="margin-top: 24px; text-align: center; border-top: var(--glass-border); padding-top: 16px;">
                <button class="btn btn-secondary btn-block" onclick="document.getElementById('so-history-container').style.display='block'; History.load();"><i data-lucide="history"></i> Lihat History SO Saat Ini</button>
              </div>

              <!-- Container History (Hide by default) -->
              <div id="so-history-container" style="display: none; margin-top: 16px;">
                <div class="table-responsive">
                  <table class="data-table">
                    <thead><tr><th>Barcode</th><th>Qty Baru</th><th>User</th></tr></thead>
                    <tbody id="tbl-history"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </section>

          <!-- Modal dan elemen lain tetap sama -->
        </div>
      </main>

      <!-- Bottom Nav (History dihapus dari sini, Dashboard & SO saja) -->
      <nav class="bottom-nav" id="main-bottom-nav">
        <a class="nav-item active" data-target="dashboard"><i data-lucide="layout-dashboard"></i> Home</a>
        <a class="nav-item" data-target="stock-opname"><i data-lucide="scan-barcode"></i> Scan SO</a>
      </nav>
    </div>
  </div>
  <!-- Scripts Include... -->
</body>
</html>
